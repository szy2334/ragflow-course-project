[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paper-review-ai"
version = "0.1.0"
description = "Evidence-grounded multi-agent workflow for scientific paper QA and review"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langgraph>=1.2,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
