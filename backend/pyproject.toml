[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paper-review-ai"
version = "0.1.0"
description = "Evidence-grounded multi-agent workflow for scientific paper QA and review"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "pydantic>=2,<3",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.31,<3",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.21,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
